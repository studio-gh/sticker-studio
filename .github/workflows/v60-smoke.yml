name: Story Studio browser regression

on:
  push:
    branches:
      - ux/mobile-editor-v61-recovery
      - main
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - .github/workflows/v61-smoke.yml
  workflow_dispatch:

jobs:
  mobile-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact V61 branch commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser test runner
        run: |
          npm init -y
          npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/story-studio-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

      - name: Test mobile canvas, text editing, curve, and export; capture screenshots
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true
          });
          const page = await context.newPage();
          page.on('pageerror', error => { errors.push(error.message); console.error('PAGE_ERROR:', error.stack || error.message); });
          page.on('console', msg => { if (msg.type() === 'error') console.error('BROWSER_CONSOLE_ERROR:', msg.text()); });

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
          const languageButton = page.locator('#languageToggle');
          await page.waitForTimeout(500);
          const initialLanguageState = await page.evaluate(() => ({ lang: document.documentElement.lang, toggle: document.querySelector('#languageToggle')?.textContent, headline: document.querySelector('#home .hero h1')?.innerText, ready: document.readyState }));
          console.log('INITIAL_LANGUAGE_STATE:', JSON.stringify(initialLanguageState));
          assert.equal(initialLanguageState.lang, 'pt-BR', 'Portuguese should be the initial document language');
          assert.equal(initialLanguageState.toggle?.trim(), 'EN', 'Toggle should offer English after Portuguese initialization');
          assert.match(initialLanguageState.headline || '', /Faça seu Story/i, 'Home headline should be Brazilian Portuguese after initialization');
          assert.equal(await languageButton.innerText(), 'EN', 'After language initialization, Portuguese should be active and the toggle should offer English');
          assert.match(await page.locator('#home .hero h1').innerText(), /Faça seu Story/i, 'Home headline should start in Brazilian Portuguese');
          await languageButton.click();
          await page.waitForFunction(() => document.documentElement.lang === 'en' && document.querySelector('#languageToggle')?.textContent.trim() === 'PT-BR' && /Make your Story/i.test(document.querySelector('#home .hero h1')?.innerText || ''), null, { timeout: 5000 });
          assert.equal(await languageButton.innerText(), 'PT-BR', 'Toggle should offer Portuguese while English is active');
          assert.match(await page.locator('#home .hero h1').innerText(), /Make your Story/i, 'Toggle should translate the home headline to English');
          await languageButton.click();
          await page.waitForFunction(() => document.documentElement.lang === 'pt-BR' && document.querySelector('#languageToggle')?.textContent.trim() === 'EN' && /Faça seu Story/i.test(document.querySelector('#home .hero h1')?.innerText || ''), null, { timeout: 5000 });
          assert.match(await page.locator('#home .hero h1').innerText(), /Faça seu Story/i, 'Second toggle should restore Portuguese');
          await page.locator('.nav-btn[data-view="create"]').click();
          await page.waitForTimeout(350);
          assert.ok(await page.locator('.layer-tools[hidden]').count() === 1, 'Layer actions must be hidden for an empty canvas');
          await page.screenshot({ path: 'artifacts/v61-mobile-editor-empty.png', fullPage: true });

          const stage = page.locator('#stage');
          await stage.waitFor({ state: 'visible' });
          let rect = await stage.boundingBox();
          assert.ok(rect && rect.width > 100 && rect.height > 170, 'Mobile canvas must be visible and usable');
          assert.ok(Math.abs(rect.height / rect.width - 16 / 9) < 0.03, 'Canvas must keep 9:16 ratio');
          await page.screenshot({ path: 'artifacts/v61-mobile-empty-canvas.png', fullPage: true });

          await page.evaluate(() => window.addText('Story Studio V61'));
          await page.waitForTimeout(150);
          assert.equal(await page.locator('#textValue').inputValue(), 'Story Studio V61', 'New text must be retained in input');
          assert.ok(await page.locator('#stage .layer').count() === 1, 'Adding text must create a layer');
          rect = await stage.boundingBox();
          const layerRect = await page.locator('#stage .layer').boundingBox();
          assert.ok(layerRect, 'Text layer must render on canvas');
          const centerRatio = (layerRect.y + layerRect.height / 2 - rect.y) / rect.height;
          const textLayerState = await page.evaluate(() => {
            const stage = document.querySelector('#stage');
            const layer = document.querySelector('#stage .layer');
            return {
              stageWidth: stage.getBoundingClientRect().width,
              stageHeight: stage.getBoundingClientRect().height,
              layerLeft: layer.style.left,
              layerTop: layer.style.top,
              layerTransform: layer.style.transform
            };
          });
          console.log('TEXT_LAYER_GEOMETRY:', JSON.stringify({ stage: rect, layer: layerRect, centerRatio, ...textLayerState }));
          assert.ok(centerRatio > 0.42 && centerRatio < 0.58, 'New text must stay centered after the mobile preview resizes for editing');
          await page.locator('#textValue').fill('Prévia em tempo real');
          await page.waitForFunction(() => document.querySelector('#stage .layer .text-content')?.textContent === 'Prévia em tempo real');
          assert.equal(await page.locator('#stage .layer .text-content').innerText(), 'Prévia em tempo real', 'The canvas preview must update while typing');
          await page.locator('#textValue').fill('Story Studio V61');
          await page.screenshot({ path: 'artifacts/v61-mobile-text-focus.png', fullPage: true });
          const typingPreview = await page.evaluate(() => {
            const canvas = document.querySelector('#stage').getBoundingClientRect();
            const input = document.querySelector('#textValue').getBoundingClientRect();
            return { canvasTop: canvas.top, canvasBottom: canvas.bottom, inputTop: input.top, inputBottom: input.bottom, inputFocused: document.activeElement.id === 'textValue' };
          });
          assert.equal(typingPreview.inputFocused, true, 'Text field must retain focus after creating a layer');
          assert.ok(typingPreview.canvasBottom <= typingPreview.inputTop + 10, 'Pinned preview should not overlap text input');

          await page.setViewportSize({ width: 390, height: 460 });
          await page.evaluate(() => document.body.classList.add('keyboard-open'));
          await page.waitForTimeout(100);
          const keyboardState = await page.evaluate(() => {
            const canvas = document.querySelector('#stage').getBoundingClientRect();
            const input = document.querySelector('#textValue').getBoundingClientRect();
            return { canvasTop: canvas.top, canvasBottom: canvas.bottom, inputTop: input.top, inputBottom: input.bottom, viewport: window.innerHeight };
          });
          const keyboardLayout = await page.evaluate(() => ({
            stageWrap: (() => { const r = document.querySelector('#stage').parentElement.getBoundingClientRect(); return { top:r.top, bottom:r.bottom, height:r.height }; })(),
            bodyClasses: document.body.className,
            previewTopVariable: getComputedStyle(document.documentElement).getPropertyValue('--keyboard-preview-top')
          }));
          console.log('KEYBOARD_LAYOUT_STATE:', JSON.stringify({ ...keyboardState, ...keyboardLayout }));
          assert.ok(keyboardState.canvasTop >= -2 && keyboardState.canvasBottom < keyboardState.viewport * 0.68, 'Compact layout emulation should keep the canvas in the top region');
          assert.ok(keyboardState.inputTop >= keyboardState.canvasBottom - 1 && keyboardState.inputTop < keyboardState.viewport, 'Text input should remain below the preview and in the visible area');
          await page.screenshot({ path: 'artifacts/mobile-compact-layout-emulation.png', fullPage: true });

          await page.setViewportSize({ width: 390, height: 844 });
          await page.evaluate(() => {
            document.body.classList.remove('keyboard-open');
            document.activeElement?.blur();
            document.body.classList.remove('keyboard-open');
            window.setProp('fontSize', 68);
            window.setTextProp('curve', 30);
          });
          await page.waitForTimeout(150);
          assert.equal(await page.locator('#textValue').inputValue(), 'Story Studio V61', 'Size/curve changes must not remove text content');
          const curved = await page.locator('#stage .layer svg textPath').textContent();
          assert.equal(curved, 'Story Studio V61', 'Curved text must retain the full string in live preview');

          await page.evaluate(() => window.setCurveMode('circle'));
          const circleGeometry = await page.evaluate(() => {
            const path = document.querySelector('#stage .layer svg defs path')?.getAttribute('d') || '';
            const textPath = document.querySelector('#stage .layer svg textPath');
            return { path, textLength: Number(textPath?.getAttribute('textLength') || 0) };
          });
          assert.ok((circleGeometry.path.match(/ A /g) || []).length >= 2, 'Circular text path must close a full 360-degree loop');
          assert.ok(circleGeometry.textLength > 0, 'Circular text must distribute text around the full circumference');
          await page.evaluate(() => window.setTextProp('curveRadius', 150));
          assert.equal(await page.locator('#curveRadiusVal').innerText(), '150', 'Circle radius control must update the selected text');
          await page.screenshot({ path: 'artifacts/v61-mobile-circular-text.png', fullPage: true });

          const exported = await page.evaluate(async () => {
            const blob = await window.renderBlob();
            const bitmap = await createImageBitmap(blob);
            return { width: bitmap.width, height: bitmap.height, size: blob.size };
          });
          assert.ok(exported.width > 0 && exported.height > 0 && exported.size > 100, 'PNG export rendering must return image pixels');
          await page.screenshot({ path: 'artifacts/v61-mobile-curved-text.png', fullPage: true });

          const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          desktop.on('pageerror', error => errors.push(error.message));
          await desktop.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
          await desktop.locator('.nav-btn[data-view="create"]').click();
          const desktopStage = await desktop.locator('#stage').boundingBox();
          assert.ok(desktopStage && Math.abs(desktopStage.height / desktopStage.width - 16 / 9) < 0.03, 'Desktop canvas must keep 9:16 ratio');
          await desktop.screenshot({ path: 'artifacts/v61-desktop-empty-canvas.png', fullPage: true });

          assert.deepEqual(errors, [], 'Page must not produce uncaught JavaScript errors');
          console.log(JSON.stringify({ result: 'PASS', exported, screenshots: 7, errors }, null, 2));
          await browser.close();
          NODE

      - name: Upload browser screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-studio-v61-visual-evidence
          path: artifacts/
          if-no-files-found: warn
