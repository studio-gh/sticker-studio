<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fffcf4">
  <title>Story Studio · Em atualização</title>
  <style>
    :root{color-scheme:light;--paper:#fffcf4;--ink:#2c2c2c;--accent:#ff9614}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:28px}
    main{width:min(100%,560px);padding:clamp(28px,7vw,56px);border:1px solid rgba(44,44,44,.14);border-radius:22px;background:rgba(255,255,255,.38)}
    .mark{width:42px;height:6px;border-radius:10px;background:var(--accent);margin-bottom:42px}
    p.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.62;margin:0 0 14px}
    h1{font-size:clamp(34px,8vw,54px);line-height:1.02;letter-spacing:-.055em;margin:0 0 22px;font-weight:750}
    p{margin:0;max-width:38ch;font-size:17px;opacity:.78}
    footer{margin-top:48px;font-size:12px;letter-spacing:.04em;opacity:.48}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <p class="kicker">Story Studio</p>
    <h1>Estamos preparando uma nova versão.</h1>
    <p>O editor está temporariamente indisponível enquanto finalizamos e validamos a próxima versão. Voltaremos quando estiver pronta.</p>
    <footer>UMA NOVA EXPERIÊNCIA, EM PREPARAÇÃO.</footer>
  </main>
</body>
</html>
